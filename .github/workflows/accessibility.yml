name: Accessibility

# Guardrails for the Section 508 / WCAG 2.1 AA remediation (BACKLOG.md Feature #6).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-a11y:
    name: eslint jsx-a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  axe-e2e:
    name: axe smoke (public routes)
    runs-on: ubuntu-latest
    # Informational for now: the public pages still report axe violations that
    # are documented brand-palette exceptions (see docs/accessibility/VPAT.md).
    # Flip to a hard gate if/when those are resolved.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-report
          path: playwright-report/
          retention-days: 7
