    <!--
      Google Ads conversion tracking — Security note:
      CWE-614 (missing Secure flag): RESOLVED. gclidCookieMiddleware (server/routes-gtag.ts)
        writes _gcl_aw with HttpOnly+Secure+SameSite=Lax on every landing that carries ?gclid=.
      CWE-1004 (missing HttpOnly flag): RESOLVED. The client-side gtag.js script has been
        removed. The _gcl_aw (GAESA) cookie is set exclusively server-side by
        gclidCookieMiddleware; no client-side JavaScript can write it.
        Conversion uploads use the Google Ads uploadClickConversions REST API
        (sendGoogleAdsConversion in server/routes-gtag.ts), called from
        POST /api/auth/verify-email after the user confirms their email address,
        reading the gclid from the HttpOnly cookie. Idempotent: each user's
        conversion is uploaded at most once (tracked in convertedUserIds).
        Activate by setting GOOGLE_ADS_DEVELOPER_TOKEN, GOOGLE_ADS_CUSTOMER_ID,
        GOOGLE_ADS_CONVERSION_ACTION_ID, GOOGLE_ADS_OAUTH_CLIENT_ID,
        GOOGLE_ADS_OAUTH_CLIENT_SECRET, GOOGLE_ADS_OAUTH_REFRESH_TOKEN.
    -->
    <script>
      (function() {
        var theme = localStorage.getItem('vega-theme') || 'dark';
        document.documentElement.classList.add(theme);
      })();
    </script>
    <style>
      html { background-color: #0a0a0b; }
      html.light { background-color: #ffffff; }
    </style>
